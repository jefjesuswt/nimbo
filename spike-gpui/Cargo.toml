[package]
name = "nimbo-spike-gpui"
version = "0.0.1"
edition = "2024"
publish = false

# Spike 16.0-bis: ¿GPUI en vez de Compose Desktop? No entra en main.
[dependencies]
gpui-kit = "0.10.0"
tdlib-rs = { version = "1.4.0", features = ["download-tdlib"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-channel = "2"
qrcode = { version = "0.14", default-features = false }
tiny_http = "0.12"
base64 = "0.22"
image = { version = "0.25", default-features = false }
lofty = "0.22"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
encoding_rs = "0.8"

[build-dependencies]
tdlib-rs = { version = "1.4.0", features = ["download-tdlib"] }

[profile.dev]
opt-level = 1
